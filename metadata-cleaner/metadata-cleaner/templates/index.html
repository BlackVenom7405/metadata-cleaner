<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Metadata Cleaner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.2);
    }
    .btn-custom {
      background-color: #007bff;
      color: white;
      border-radius: 8px;
      font-weight: 500;
    }
    .btn-custom:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h2 class="text-center mb-3">🧹 Metadata Cleaner</h2>
          <p class="text-center text-muted">Upload your file (JPG, PNG, PDF, DOCX) and remove hidden metadata instantly.</p>
          
          <form method="POST" enctype="multipart/form-data" class="mt-3">
            <div class="mb-3">
              <input class="form-control" type="file" name="file" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-custom">Clean Metadata & Download</button>
            </div>
          </form>

          <div class="mt-4 text-center small text-muted">
            🔒 Privacy Friendly – No data is stored on server
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
